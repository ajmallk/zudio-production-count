<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — VKC QR Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f0f4ff 0%, #faf5ff 50%, #fff1f2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Decorative blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
    }
    .blob-1 { width:400px;height:400px;background:#c7d2fe;top:-100px;left:-100px; }
    .blob-2 { width:300px;height:300px;background:#fce7f3;bottom:-80px;right:-60px; }
    .blob-3 { width:200px;height:200px;background:#ddd6fe;top:40%;right:10%; }

    .login-card {
      background: rgba(255,255,255,0.90);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 24px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      box-shadow: 0 20px 60px rgba(79,70,229,0.10), 0 4px 16px rgba(0,0,0,0.06);
    }
    .logo-ring {
      width: 68px; height: 68px;
      background: linear-gradient(135deg, #4f46e5, #e11d48);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.25rem;
      box-shadow: 0 8px 24px rgba(79,70,229,0.30);
      animation: float 3.5s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    h2 { font-weight: 800; color: #1e293b; font-size: 1.45rem; margin-bottom: 0.2rem; }
    .sub { color: #64748b; font-size: 0.83rem; }

    .form-control {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #1e293b;
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    .form-control:focus {
      background: white;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
      color: #1e293b;
    }
    .form-control::placeholder { color: #94a3b8; }
    .form-label { color: #475569; font-size: 0.82rem; font-weight: 600; }

    .input-group-text {
      background: #ede9fe;
      border: 1px solid #e2e8f0;
      color: #4f46e5;
      border-radius: 10px 0 0 10px;
    }
    .input-group .form-control { border-radius: 0 10px 10px 0; }

    .btn-login {
      background: linear-gradient(135deg, #4f46e5, #3730a3);
      border: none;
      color: white;
      font-weight: 700;
      border-radius: 10px;
      padding: 0.75rem;
      font-size: 0.95rem;
      width: 100%;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(79,70,229,0.30);
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(79,70,229,0.40);
      color: white;
    }

    .error-box {
      background: #fff1f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
    }

    .feature-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #ede9fe;
      color: #4f46e5;
      border-radius: 20px;
      padding: 0.25rem 0.75rem;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .footer-note { color: #94a3b8; font-size: 0.72rem; }
  </style>
</head>
<body>
  <!-- Decorative blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="login-card">
    <div class="text-center mb-4">
      <div class="logo-ring">
        <i class="bi bi-qr-code-scan" style="color:white;font-size:1.9rem;"></i>
      </div>
      <h2>VKC QR Tracker</h2>
      <p class="sub mb-3">Footwear Production & Stock System</p>
      <div class="d-flex gap-2 justify-content-center flex-wrap">
        <span class="feature-pill"><i class="bi bi-qr-code"></i> QR Generation</span>
        <span class="feature-pill"><i class="bi bi-camera"></i> Live Scanner</span>
        <span class="feature-pill"><i class="bi bi-bar-chart"></i> Reports</span>
      </div>
    </div>

    {% if error %}
    <div class="error-box mb-3">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
    </div>
    {% endif %}
    {% if form.errors %}
    <div class="error-box mb-3">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>Invalid username or password.
    </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_username" class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
          <input type="text" name="username" id="id_username" class="form-control"
                 placeholder="Enter username" autocomplete="username" required />
        </div>
      </div>
      <div class="mb-4">
        <label for="id_password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" name="password" id="id_password" class="form-control"
                 placeholder="Enter password" autocomplete="current-password" required />
        </div>
      </div>
      <button type="submit" class="btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <div class="text-center mt-4 footer-note">
      VKC Fortune Elastomers Pvt. Ltd. &copy; 2026
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
